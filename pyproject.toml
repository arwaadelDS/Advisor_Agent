[project]
name = "advisor-agent"
version = "0.1.0"
description = "Multi-agent wealth advisor system for SNB Capital use case"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.5",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "graph", "ingestion"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
